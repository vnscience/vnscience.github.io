<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Voice Translator App (Streaming)</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải thư viện Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; 
        }
        .main-card {
            box-shadow: 0 20px 40px -10px rgba(49, 46, 129, 0.2), 0 0 15px rgba(0, 0, 0, 0.05);
        }
        .pulsing-dot {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .transcript-box {
            /* Tăng chiều cao tối đa để hiển thị rõ ràng hơn */
            max-height: 35vh; 
            min-height: 15vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 1rem; /* Thêm padding để văn bản không dính vào mép */
        }
        /* Loại bỏ khoảng cách dòng mặc định (space-y-3) và đảm bảo văn bản liên tục */
        .continuous-text {
            white-space: pre-wrap; /* Giữ các khoảng trắng và ngắt dòng (nếu có, mặc dù chúng ta sẽ dùng dấu cách) */
            line-height: 1.6;
        }
        .lang-switch-btn {
            @apply px-4 py-2 rounded-full font-bold transition duration-200 cursor-pointer;
        }
        .lang-switch-btn.active {
            @apply bg-white text-indigo-700 shadow-md;
        }
        .lang-switch-btn:not(.active) {
            @apply bg-transparent text-gray-400 hover:text-indigo-600;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-4xl bg-white main-card rounded-3xl p-6 md:p-10">
        
        <div class="flex justify-between items-center mb-4 border-b pb-4">
            <div id="ui-lang-switch" class="bg-indigo-100 rounded-full p-1 flex space-x-2">
                <button class="lang-switch-btn active bg-indigo-500 text-white rounded-full px-4 py-1 font-medium transition-colors duration-200" data-lang="vi" onclick="updateUI('vi')">
                    Vie
                </button>
                <button class="lang-switch-btn bg-white text-indigo-600 rounded-full px-4 py-1 font-medium hover:bg-indigo-200 transition-colors duration-200 ml-1" data-lang="en" onclick="updateUI('en')">
                    En
                </button>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 flex items-center justify-center text-center flex-grow">
                <span class="material-icons text-indigo-600 text-4xl mr-3">mic_chat</span>
                <span id="app-title">Dịch Hội Thoại TRỰC TIẾP (Streaming)</span>
            </h1>
        </div>
        
        <p id="app-subtitle" class="text-center text-gray-500 mb-6">Chế độ tối ưu cho cuộc họp</p>

        <!-- Trạng thái ứng dụng -->
        <div class="mb-8 p-4 rounded-xl text-center font-semibold transition-colors" id="status-box">
            Sẵn sàng.
        </div>

        <!-- Cài đặt ngôn ngữ -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-6 mb-8">
            <div class="p-4 bg-indigo-50 rounded-xl shadow-inner w-full md:w-5/12">
                <label for="source-lang" id="label-source-lang" class="block text-sm font-bold text-indigo-700 mb-2">1. Ngôn ngữ Nguồn (Nói)</label>
                <select id="source-lang" class="w-full p-3 border border-indigo-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    <option value="vi-VN">🇻🇳 Tiếng Việt</option>
                    <option value="en-US" selected>🇺🇸 English</option>
                    <option value="zh-CN">🇨🇳 Chinese (Simplified)</option>
                    <option value="fr-FR">🇫🇷 France</option>
                    <option value="es-ES">🇪🇸 Spanish</option>
                    <option value="ja-JP">🇯🇵 Japanese</option>
                    <option value="ko-KR">🇰🇷 Koreaa</option>
                </select>
            </div>

            <!-- Nút Đảo Chiều Ngôn Ngữ -->
            <button id="swap-btn" onclick="swapLanguages()" class="p-3 bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 transition duration-200 transform hover:scale-110 md:mt-6 flex-shrink-0">
                <span class="material-icons text-3xl">swap_horiz</span>
            </button>

            <div class="p-4 bg-green-50 rounded-xl shadow-inner w-full md:w-5/12">
                <label for="target-lang" id="label-target-lang" class="block text-sm font-bold text-green-700 mb-2">2. Ngôn ngữ Đích (Dịch)</label>
                <select id="target-lang" class="w-full p-3 border border-green-300 rounded-lg bg-white focus:ring-2 focus:ring-green-500 focus:border-green-500 transition">
                    <option value="vi-VN" selected>🇻🇳 Tiếng Việt</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="zh-CN">🇨🇳 Chinese (Simplified)</option>
                    <option value="fr-FR">🇫🇷 France</option>
                    <option value="es-ES">🇪🇸 Spanish</option>
                    <option value="ja-JP">🇯🇵 Japanese</option>
                    <option value="ko-KR">🇰🇷 Koreaa</option>
                </select>
            </div>
        </div>

        <!-- Nút Bắt đầu/Dừng -->
        <div class="text-center mb-10">
            <button id="start-btn" onclick="toggleListening()" class="flex items-center justify-center mx-auto text-white font-bold py-4 px-10 rounded-full transition duration-300 shadow-xl hover:shadow-2xl focus:outline-none focus:ring-4 focus:ring-indigo-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed bg-indigo-600 hover:bg-indigo-700">
                <span class="material-icons mr-2 text-3xl" id="mic-icon">play_arrow</span>
                <span id="btn-text">BẮT ĐẦU DỊCH</span>
            </button>
        </div>

        <!-- KHU VỰC HIỂN THỊ STREAMING -->
        <div class="grid grid-cols-1 gap-6"> 
            
            <!-- Văn bản Nguồn (Phần trên) -->
            <div class="bg-white rounded-xl border-2 border-indigo-200 shadow-lg">
                <h3 class="font-bold text-indigo-700 p-5 pb-3 flex items-center text-xl border-b border-indigo-100">
                    <span class="material-icons mr-2 text-3xl">record_voice_over</span>
                    <span id="title-source-text">Văn Bản Đã Nghe (Nguồn)</span>
                </h3>
                <div id="source-transcript" class="transcript-box text-gray-800 text-lg font-semibold bg-indigo-50/50">
                    <!-- CONTINOUS STREAM CONTAINER -->
                    <span id="source-continuous-text" class="continuous-text"></span>
                    <!-- Draft Text -->
                    <p id="source-interim" class="text-gray-500 italic text-base pt-2"></p>
                </div>
            </div>

            <!-- Văn bản Đích (Dịch - Phần dưới) -->
            <div class="bg-white rounded-xl border-2 border-green-200 shadow-lg">
                <h3 class="font-bold text-green-700 p-5 pb-3 flex items-center text-xl border-b border-green-100">
                    <span class="material-icons mr-2 text-3xl">language</span>
                    <span id="title-target-text">Bản Dịch (Đích)</span>
                </h3>
                <div id="target-text" class="transcript-box text-gray-800 text-lg font-bold bg-green-50/50">
                    <!-- CONTINOUS STREAM CONTAINER -->
                    <span id="target-continuous-text" class="continuous-text"></span>
                </div>
            </div>
        </div>
        <div id="error-message" class="hidden mt-6 p-4 bg-red-100 text-red-700 rounded-lg font-medium"></div>
    </div>

    <script type="module">
        // --- Cấu hình Ngôn ngữ Giao diện (i18n) ---
        const i18n = {
            'vi': {
                title: 'Dịch Hội Thoại TRỰC TIẾP (Streaming)',
                subtitle: 'Chế độ tối ưu cho cuộc họp',
                ready: 'Sẵn sàng.',
                statusListening: 'ĐANG LẮNG NGHE (STREAMING)...',
                statusTranslating: 'ĐANG DỊCH NGAY LẬP TỨC...',
                statusStopped: 'Đã dừng. Sẵn sàng bắt đầu.',
                statusError: 'Lỗi nhận dạng giọng nói nghiêm trọng:',
                statusRestarting: 'Lỗi: %s. Tự động khởi động lại...',
                sourceLangLabel: '1. Ngôn ngữ Nguồn (Nói)',
                targetLangLabel: '2. Ngôn ngữ Đích (Dịch)',
                sourceTextTitle: 'Văn Bản Đã Nghe (Nguồn)',
                targetTextTitle: 'Bản Dịch (Đích)',
                startBtn: 'BẮT ĐẦU DỊCH',
                stopBtn: 'DỪNG DỊCH',
                browserNotSupported: 'Trình duyệt không hỗ trợ Web Speech Recognition API.',
                systemNotReady: 'Hệ thống chưa sẵn sàng. Vui lòng thử lại.',
                selectLangStart: 'Chọn ngôn ngữ và nhấn BẮT ĐẦU DỊCH.',
                translateServiceUnavailable: 'Dịch vụ dịch thuật không khả dụng',
                noTranslationReceived: 'Không nhận được văn bản dịch.',
                translationError: 'Lỗi dịch thuật nhanh:',
                startRecognitionError: 'Không thể bắt đầu nhận dạng:',
            },
            'en': {
                title: 'Real-time Voice Translator (Streaming)',
                subtitle: 'Optimized mode for long meetings',
                ready: 'Ready.',
                statusListening: 'LISTENING (STREAMING)...',
                statusTranslating: 'TRANSLATING INSTANTLY...',
                statusStopped: 'Stopped. Ready to start.',
                statusError: 'Severe speech recognition error:',
                statusRestarting: 'Error: %s. Automatic restart...',
                sourceLangLabel: '1. Source Language (Spoken)',
                targetLangLabel: '2. Target Language (Translated)',
                sourceTextTitle: 'Transcribed Text (Source)',
                targetTextTitle: 'Translation (Target)',
                startBtn: 'START TRANSLATION',
                stopBtn: 'STOP TRANSLATION',
                browserNotSupported: 'Browser does not support Web Speech Recognition API.',
                systemNotReady: 'System not ready. Please try again.',
                selectLangStart: 'Select languages and press START TRANSLATION.',
                translateServiceUnavailable: 'Translation service unavailable',
                noTranslationReceived: 'No translation text received.',
                translationError: 'Fast translation error:',
                startRecognitionError: 'Could not start recognition:',
            }
        };

        // --- Biến Toàn cục ---
        let recognition = null;
        let isListening = false;
        let currentUILang = 'vi'; // Mặc định là Tiếng Việt
        
        // --- DOM Elements ---
        const startBtn = document.getElementById('start-btn');
        const btnText = document.getElementById('btn-text');
        const micIcon = document.getElementById('mic-icon');
        const statusBox = document.getElementById('status-box');
        const sourceLangSelect = document.getElementById('source-lang');
        const targetLangSelect = document.getElementById('target-lang');
        const sourceContinuousTextEl = document.getElementById('source-continuous-text');
        const targetContinuousTextEl = document.getElementById('target-continuous-text');
        const sourceInterimEl = document.getElementById('source-interim');
        const targetTextContainerEl = document.getElementById('target-text');
        const errorEl = document.getElementById('error-message');
        const uiLangSwitch = document.getElementById('ui-lang-switch');

        // --- Localization & UI Functions ---

        /** Cập nhật toàn bộ giao diện theo ngôn ngữ mới */
        window.updateUI = function(lang) {
            currentUILang = lang;
            const strings = i18n[lang];

            // Cập nhật các nút chuyển đổi ngôn ngữ
            uiLangSwitch.querySelectorAll('button').forEach(btn => {
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Cập nhật nội dung
            document.querySelector('title').textContent = strings.title;
            document.getElementById('app-title').textContent = strings.title;
            document.getElementById('app-subtitle').textContent = strings.subtitle;
            document.getElementById('label-source-lang').textContent = strings.sourceLangLabel;
            document.getElementById('label-target-lang').textContent = strings.targetLangLabel;
            document.getElementById('title-source-text').textContent = strings.sourceTextTitle;
            document.getElementById('title-target-text').textContent = strings.targetTextTitle;
            
            // Cập nhật trạng thái và nút bấm
            if (isListening) {
                btnText.textContent = strings.stopBtn;
                updateStatus(strings.statusListening, 'listening');
            } else {
                btnText.textContent = strings.startBtn;
                updateStatus(strings.selectLangStart, 'ready');
            }
        };

        /** Đảo chiều ngôn ngữ Nguồn và Đích */
        window.swapLanguages = function() {
            if (isListening) {
                // Không cho phép swap khi đang nghe
                const langStrings = i18n[currentUILang];
                updateStatus(langStrings.statusStopped + ' (' + (currentUILang === 'vi' ? 'Vui lòng dừng trước khi đảo chiều' : 'Please stop before swapping') + ')', 'error');
                setTimeout(() => updateStatus(langStrings.selectLangStart, 'ready'), 3000);
                return;
            }
            
            const sourceVal = sourceLangSelect.value;
            const targetVal = targetLangSelect.value;
            
            sourceLangSelect.value = targetVal;
            targetLangSelect.value = sourceVal;

            // Xóa nội dung khi đảo chiều ngôn ngữ
            sourceContinuousTextEl.textContent = '';
            targetContinuousTextEl.textContent = '';
            sourceInterimEl.textContent = '';
            updateStatus(i18n[currentUILang].selectLangStart, 'ready');
        };

        /** Trích xuất mã ngôn ngữ ISO 639-1 (ví dụ: 'en' từ 'en-US') */
        function getBaseLangCode(fullCode) {
            return fullCode.split('-')[0];
        }

        /** Hiển thị thông báo trạng thái */
        function updateStatus(message, type = 'info') {
            const strings = i18n[currentUILang];
            statusBox.className = 'mb-8 p-4 rounded-xl text-center font-semibold transition-colors';
            errorEl.classList.add('hidden');
            
            if (type === 'listening') {
                statusBox.classList.add('bg-red-100', 'text-red-700');
                statusBox.innerHTML = `<span class="pulsing-dot inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span> ${strings.statusListening}`;
                statusBox.title = strings.statusListening;
            } else if (type === 'translating') {
                statusBox.classList.add('bg-yellow-100', 'text-yellow-700');
                statusBox.innerHTML = `<span class="material-icons animate-spin mr-2">bolt</span> ${strings.statusTranslating}`;
                statusBox.title = strings.statusTranslating;
            } else if (type === 'ready') {
                statusBox.classList.add('bg-blue-100', 'text-blue-700');
                statusBox.textContent = message;
                statusBox.title = message;
            } else if (type === 'error') {
                statusBox.classList.add('bg-red-100', 'text-red-700');
                statusBox.textContent = strings.statusStopped;
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
        }
        
        // --- FAST TRANSLATE LOGIC (Public API) ---
        async function fastTranslateText(sourceText, sourceLangFullCode, targetLangFullCode) {
            const strings = i18n[currentUILang];
            
            // Sử dụng mã ISO 639-1 (hai chữ cái) cho API dịch thuật nhanh
            const sourceLang = getBaseLangCode(sourceLangFullCode);
            const targetLang = getBaseLangCode(targetLangFullCode);

            // API dịch thuật nhanh công cộng (Không sử dụng Gemini API cho việc dịch nhanh streaming này)
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(sourceText)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`${strings.translateServiceUnavailable} (${response.status})`);
                }
                const data = await response.json();
                
                if (data && data[0] && data[0].length > 0) {
                    let translatedText = '';
                    data[0].forEach(segment => {
                        translatedText += segment[0];
                    });
                    return translatedText.trim();
                } else {
                    throw new Error(strings.noTranslationReceived);
                }

            } catch (error) {
                console.error(strings.translationError, error);
                throw new Error(`${strings.translationError} ${error.message}`);
            }
        }

        /** Xử lý Segment và Dịch ngay lập tức */
        async function translateSegment(textSegment) {
            
            if (textSegment.length === 0) return;
            const strings = i18n[currentUILang];

            // 1. Thêm nội dung đã hoàn tất (segment) vào luồng liên tục
            sourceContinuousTextEl.textContent += textSegment + ' ';
            sourceContinuousTextEl.parentElement.scrollTop = sourceContinuousTextEl.parentElement.scrollHeight;
            sourceInterimEl.textContent = ''; // Xóa kết quả tạm thời

            try {
                const sourceLangFullCode = sourceLangSelect.value;
                const targetLangFullCode = targetLangSelect.value;
                
                updateStatus(strings.statusTranslating, 'translating');

                const translatedText = await fastTranslateText(textSegment, sourceLangFullCode, targetLangFullCode);
                
                // 2. Thêm nội dung dịch vào luồng liên tục
                targetContinuousTextEl.textContent += translatedText + ' ';
                targetTextContainerEl.scrollTop = targetTextContainerEl.scrollHeight;

                // 3. Khôi phục trạng thái lắng nghe
                if (isListening) {
                    updateStatus(strings.statusListening, 'listening');
                }

            } catch (error) {
                console.error(error);
                // Hiển thị lỗi cho người dùng nhưng vẫn cố gắng tiếp tục nghe
                updateStatus(error.message, 'error');
                if (isListening) {
                     // Sau 3s, khôi phục lại trạng thái lắng nghe trên giao diện
                     setTimeout(() => updateStatus(strings.statusListening, 'listening'), 3000);
                }
            }
        }


        // --- Speech Recognition Logic ---
        
        function setupRecognition() {
            const strings = i18n[currentUILang];
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                updateStatus(strings.browserNotSupported, 'error');
                startBtn.disabled = true;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                const strings = i18n[currentUILang];
                isListening = true;
                // Xóa nội dung cũ khi bắt đầu
                sourceContinuousTextEl.textContent = '';
                targetContinuousTextEl.textContent = '';
                sourceInterimEl.textContent = '';
                
                micIcon.textContent = 'stop';
                btnText.textContent = strings.stopBtn;
                startBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                startBtn.classList.add('bg-red-600', 'hover:bg-red-700');
                updateStatus(strings.statusListening, 'listening');
            };

            recognition.onend = () => {
                const strings = i18n[currentUILang];
                isListening = false;
                micIcon.textContent = 'play_arrow';
                btnText.textContent = strings.startBtn;
                startBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                startBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                updateStatus(strings.statusStopped, 'ready');
            };

            recognition.onresult = (event) => {
                let currentInterim = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const result = event.results[i];
                    
                    if (result.isFinal) {
                        const finalSegment = result[0].transcript.trim();
                        translateSegment(finalSegment);
                        
                    } else {
                        currentInterim += result[0].transcript;
                    }
                }

                // Hiển thị văn bản tạm thời (draft)
                if (currentInterim.length > 0) {
                    sourceInterimEl.textContent = `... ${currentInterim}`;
                    sourceContinuousTextEl.parentElement.scrollTop = sourceContinuousTextEl.parentElement.scrollHeight;
                } else {
                    sourceInterimEl.textContent = '';
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                const strings = i18n[currentUILang];
                if (isListening && (event.error === 'no-speech' || event.error === 'network')) {
                     updateStatus(strings.statusRestarting.replace('%s', event.error), 'error');
                     setTimeout(() => recognition.start(), 500);
                } else {
                    recognition.stop();
                    updateStatus(`${strings.statusError} ${event.error}`, 'error');
                }
            };
        }

        function startRecognition() {
            const strings = i18n[currentUILang];
            recognition.lang = sourceLangSelect.value;
            try {
                recognition.start();
            } catch (e) {
                if (e.name !== 'InvalidStateError') {
                    updateStatus(`${strings.startRecognitionError} ${e.message}`, 'error');
                }
            }
        }

        // --- Global Controller ---

        window.toggleListening = function() {
            const strings = i18n[currentUILang];
            if (!recognition) {
                updateStatus(strings.systemNotReady, 'error');
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                startRecognition();
            }
        };

        // Khởi tạo ứng dụng khi cửa sổ tải xong
        window.onload = function() {
            setupRecognition();
            updateUI(currentUILang); // Đảm bảo giao diện được tải bằng ngôn ngữ mặc định (vi)
        };
    </script>
</body>
</html>
