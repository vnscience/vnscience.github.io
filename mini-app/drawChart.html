<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ tạo báo cáo rèn luyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg border border-gray-200 h-fit">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Nhập dữ liệu
            </h2>
            
            <div id="input-container" class="space-y-3">
                </div>

            <div class="mt-6 flex gap-3">
                <button onclick="addRow()" class="flex-1 bg-blue-50 text-blue-600 px-4 py-2 rounded-lg border border-blue-200 hover:bg-blue-100 font-medium transition">+ Thêm cột</button>
                <button onclick="updateChart()" class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium shadow-md transition">Vẽ biểu đồ</button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white p-8 rounded-xl shadow-lg border border-gray-200 print:shadow-none">
            
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900 mb-4">I. Phân tích báo cáo xếp loại rèn luyện sinh viên</h1>
                
                <div class="pl-4">
                    <h3 class="text-lg font-bold text-gray-800 mb-2">1. Tổng quan:</h3>
                    <p class="text-gray-700 text-base mb-2">
                        Tổng sinh viên đánh giá rèn luyện: <span id="total-students" class="font-bold">0</span> sinh viên, trong đó:
                    </p>
                    <ul id="text-report" class="list-none space-y-1 text-gray-700">
                        </ul>
                </div>
            </div>

            <div class="relative h-96 w-full border rounded-lg p-4 bg-gray-50">
                <canvas id="myChart"></canvas>
            </div>

        </div>
    </div>

    <script>
        // Dữ liệu mẫu ban đầu (giống hình ảnh bạn gửi)
        let chartData = [
            { label: 'Xuất sắc', value: 445, color: '#4C4375' }, // Màu tím đậm
            { label: 'Tốt', value: 361, color: '#3B6978' },      // Màu xanh tối
            { label: 'Khá', value: 418, color: '#2E8B8B' },      // Màu xanh ngọc
            { label: 'Trung bình', value: 218, color: '#4FB084' },// Màu xanh lá
            { label: 'Yếu, Kém', value: 0, color: '#E5E7EB' }     // Màu xám
        ];

        let myChartInstance = null;

        // Hàm khởi tạo các ô input khi load trang
        function initInputs() {
            const container = document.getElementById('input-container');
            container.innerHTML = '';
            
            chartData.forEach((item, index) => {
                createInputRow(item.label, item.value, item.color);
            });
            updateChart(); // Vẽ lần đầu
        }

        // Hàm tạo một dòng input HTML
        function createInputRow(label = '', value = 0, color = '#3b82f6') {
            const container = document.getElementById('input-container');
            const div = document.createElement('div');
            div.className = "grid grid-cols-12 gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200 group";
            
            div.innerHTML = `
                <div class="col-span-5">
                    <input type="text" value="${label}" placeholder="Nhãn (VD: Tốt)" class="w-full text-sm border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 px-2 py-1 border outline-none input-label">
                </div>
                <div class="col-span-3">
                    <input type="number" value="${value}" placeholder="SL" class="w-full text-sm border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 px-2 py-1 border outline-none input-value">
                </div>
                <div class="col-span-2">
                    <input type="color" value="${color}" class="w-full h-8 p-0 border-0 rounded cursor-pointer input-color">
                </div>
                <div class="col-span-2 text-right">
                    <button onclick="removeRow(this)" class="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        // Thêm dòng mới
        function addRow() {
            createInputRow('Mới', 0, '#6366f1');
        }

        // Xóa dòng
        function removeRow(btn) {
            btn.closest('.grid').remove();
            // updateChart(); // Có thể bỏ comment nếu muốn xóa là cập nhật ngay
        }

        // Hàm chính: Cập nhật dữ liệu và vẽ lại biểu đồ + Text báo cáo
        function updateChart() {
            // 1. Đọc dữ liệu từ các ô input
            const labels = [];
            const dataPoints = [];
            const colors = [];
            let total = 0;

            const rows = document.querySelectorAll('#input-container .grid');
            rows.forEach(row => {
                const label = row.querySelector('.input-label').value;
                const val = parseInt(row.querySelector('.input-value').value) || 0;
                const col = row.querySelector('.input-color').value;

                labels.push(label);
                dataPoints.push(val);
                colors.push(col);
                total += val;
            });

            // 2. Cập nhật phần Text Báo Cáo
            document.getElementById('total-students').innerText = total;
            const textReportUl = document.getElementById('text-report');
            textReportUl.innerHTML = '';

            labels.forEach((lbl, i) => {
                const val = dataPoints[i];
                const percent = total > 0 ? ((val / total) * 100).toFixed(2) : 0;
                
                const li = document.createElement('li');
                li.innerHTML = `- Số sinh viên xếp loại ${lbl}: <span class="font-medium">${val}</span> sinh viên, chiếm <span class="font-medium">${percent}%</span>.`;
                textReportUl.appendChild(li);
            });

            // 3. Vẽ/Cập nhật Biểu đồ (Chart.js)
            const ctx = document.getElementById('myChart').getContext('2d');

            if (myChartInstance) {
                myChartInstance.destroy(); // Hủy biểu đồ cũ trước khi vẽ mới
            }

            myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Số sinh viên',
                        data: dataPoints,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 1,
                        borderRadius: 4, // Bo góc cột
                        barThickness: 'flex', 
                        maxBarThickness: 60
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }, // Ẩn chú thích vì đã có nhãn trục X
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y;
                                    }
                                    return label;
                                }
                            }
                        },
                        datalabels: { // (Cần plugin mở rộng nếu muốn hiện số trên đầu cột như hình, ở đây dùng JS cơ bản)
                            display: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Số sinh viên'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Xếp loại rèn luyện'
                            }
                        }
                    },
                    animation: {
                        onComplete: function () {
                            // Code vẽ số lên đầu cột (thủ công không cần plugin)
                            const chartInstance = this;
                            const ctx = chartInstance.ctx;
                            ctx.font = Chart.helpers.toFont({
                                family: 'Roboto',
                                size: 12,
                                weight: 'bold',
                            });
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillStyle = '#374151';

                            this.data.datasets.forEach(function (dataset, i) {
                                const meta = chartInstance.getDatasetMeta(i);
                                meta.data.forEach(function (bar, index) {
                                    const data = dataset.data[index];
                                    ctx.fillText(data, bar.x, bar.y - 5);
                                });
                            });
                        }
                    }
                }
            });
        }

        // Chạy khởi tạo
        initInputs();

    </script>
</body>
</html>
