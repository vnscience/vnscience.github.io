    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;

        body {

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            R2Z
        </div>

        <h1>RAR 2 ZIP</h1>

        <div class="subtitle">
            Chuyển đổi RAR sang ZIP trực tiếp trên trình duyệt
        </div>

        <!-- Drop zone -->
        <div
            class="drop-zone"
            id="dropZone"
        >

            <div class="drop-icon">
                📦
            </div>

            <div class="drop-title">
                Kéo & thả file RAR vào đây
            </div>

            <div class="drop-description">
                hoặc click để chọn file .rar
            </div>

            <input
                type="file"
                id="fileInput"
                accept=".rar,application/x-rar-compressed"
            >

        </div>

        <!-- File information -->
        <div
            class="file-info"
            id="fileInfo"
        >

            <div
                class="file-name"
                id="fileName"
            ></div>

            <div
                class="file-size"
                id="fileSize"
            ></div>

        </div>

        <!-- Convert button -->
        <button
            class="convert-btn"
            id="convertBtn"
            disabled
        >
            Chuyển sang ZIP
        </button>

        <!-- Progress -->
        <div
            class="progress-container"
            id="progressContainer"
        >

            <div class="progress-text">

                <span id="progressText">
                    Đang xử lý...
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-value"
                    id="progressValue"
                ></div>

            </div>

        </div>

        <!-- Status -->
        <div
            class="status"
            id="status"
        ></div>

        <!-- Download -->
        <a
            class="download-btn"
            id="downloadBtn"
            download
        >
            ⬇ Tải file ZIP
        </a>

        <div class="footer">
            File được xử lý trực tiếp trên trình duyệt.
            Không upload lên server.
        </div>

    </div>

</div>


<script type="module">

    /*
     * ==========================================================
     * RAR 2 ZIP
     * ==========================================================
     *
     * RAR:
     *     Browser
     *       ↓
     *     WebAssembly / UnRAR
     *       ↓
     *     Extract files
     *       ↓
     *     JSZip
     *       ↓
     *     ZIP
     *
     * Không cần Flask / Python / Backend.
     */


    const dropZone = document.getElementById("dropZone");

    const fileInput = document.getElementById("fileInput");

    const fileInfo = document.getElementById("fileInfo");

    const fileName = document.getElementById("fileName");

    const fileSize = document.getElementById("fileSize");

    const convertBtn = document.getElementById("convertBtn");

    const progressContainer =
        document.getElementById("progressContainer");

    const progressValue =
        document.getElementById("progressValue");

    const progressText =
        document.getElementById("progressText");

    const progressPercent =
        document.getElementById("progressPercent");

    const status =
        document.getElementById("status");

    const downloadBtn =
        document.getElementById("downloadBtn");


    let selectedFile = null;


    /*
     * ==========================================================
     * Chọn file
     * ==========================================================
     */

    dropZone.addEventListener("click", () => {

        fileInput.click();

    });


    fileInput.addEventListener("change", () => {

        if (fileInput.files.length > 0) {

            selectFile(fileInput.files[0]);

        }

    });


    /*
     * ==========================================================
     * Drag & Drop
     * ==========================================================
     */

    dropZone.addEventListener(
        "dragover",
        event => {

            event.preventDefault();

            dropZone.classList.add("dragover");

        }
    );


    dropZone.addEventListener(
        "dragleave",
        () => {

            dropZone.classList.remove("dragover");

        }
    );


    dropZone.addEventListener(
        "drop",
        event => {

            event.preventDefault();

            dropZone.classList.remove("dragover");

            const files = event.dataTransfer.files;

            if (files.length > 0) {

                selectFile(files[0]);

            }

        }
    );


    /*
     * ==========================================================
     * Nhận file
     * ==========================================================
     */

    function selectFile(file) {

        if (!file.name.toLowerCase().endsWith(".rar")) {

            showError(
                "Vui lòng chọn file có định dạng .RAR"
            );

            return;

        }


        selectedFile = file;


        fileName.textContent = file.name;

        fileSize.textContent =
            formatFileSize(file.size);


        fileInfo.style.display = "block";

        convertBtn.disabled = false;


        status.style.display = "none";

        downloadBtn.style.display = "none";

    }


    /*
     * ==========================================================
     * Convert
     * ==========================================================
     */

    convertBtn.addEventListener(
        "click",
        async () => {

            if (!selectedFile) {

                return;

            }


            try {

                convertBtn.disabled = true;

                progressContainer.style.display = "block";

                status.style.display = "none";

                downloadBtn.style.display = "none";


                setProgress(
                    5,
                    "Đang đọc file RAR..."
                );


                /*
                 * --------------------------------------------------
                 * Load UnRAR WASM
                 *
                 * Thư viện này cung cấp UnRAR chạy trong browser.
                 * --------------------------------------------------
                 */

                const {
                    createExtractorFromData
                } = await import(
                    "https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/index.js"
                );


                setProgress(
                    15,
                    "Đang khởi tạo bộ giải nén..."
                );


                const buffer =
                    await selectedFile.arrayBuffer();


                setProgress(
                    25,
                    "Đang giải nén RAR..."
                );


                const extractor =
                    await createExtractorFromData({
                        data: buffer
                    });


                /*
                 * Lấy danh sách file trong RAR
                 */

                const list =
                    extractor.getFileList();


                const files =
                    list.fileHeaders || [];


                if (files.length === 0) {

                    throw new Error(
                        "File RAR không chứa dữ liệu."
                    );

                }


                /*
                 * Extract toàn bộ file
                 */

                const extracted =
                    extractor.extract({
                        files: files.map(
                            item => item.name
                        )
                    });


                const extractedFiles =
                    extracted.files || [];


                if (extractedFiles.length === 0) {

                    throw new Error(
                        "Không thể giải nén file RAR."
                    );

                }


                setProgress(
                    55,
                    "Đã giải nén. Đang tạo ZIP..."
                );


                /*
                 * --------------------------------------------------
                 * Tạo ZIP bằng JSZip
                 * --------------------------------------------------
                 */

                const zip = new JSZip();


                let count = 0;

                for (
                    const item
                    of extractedFiles
                ) {

                    count++;


                    const name =
                        item.fileHeader.name;


                    /*
                     * Nếu là thư mục thì tạo folder
                     */

                    if (
                        item.fileHeader.flags
                        &&
                        item.fileHeader.flags
                            .directory
                    ) {

                        zip.folder(name);

                        continue;

                    }


                    /*
                     * Dữ liệu file
                     */

                    const data =
                        item.extraction;


                    if (!data) {

                        continue;

                    }


                    zip.file(
                        name,
                        data
                    );


                    const percent =
                        55 +
                        Math.round(
                            (count /
                                extractedFiles.length)
                            * 35
                        );


                    setProgress(
                        percent,
                        "Đang đóng gói ZIP..."
                    );

                }


                setProgress(
                    92,
                    "Đang tạo file ZIP..."
                );


                const zipBlob =
                    await zip.generateAsync({

                        type: "blob",

                        compression: "DEFLATE",

                        compressionOptions: {

                            level: 6

                        }

                    });


                /*
                 * Tên file ZIP
                 */

                const originalName =
                    selectedFile.name;


                const baseName =
                    originalName
                        .replace(
                            /\.rar$/i,
                            ""
                        );


                const zipName =
                    baseName + ".zip";


                /*
                 * Tạo link download
                 */

                const url =
                    URL.createObjectURL(
                        zipBlob
                    );


                downloadBtn.href = url;

                downloadBtn.download =
                    zipName;


                downloadBtn.style.display =
                    "block";


                setProgress(
                    100,
                    "Hoàn tất!"
                );


                showSuccess(
                    `Đã chuyển đổi thành công: ${zipName}`
                );


            }
            catch (error) {

                console.error(error);

                showError(
                    "Không thể chuyển đổi file RAR. " +
                    (error.message || "")
                );

            }
            finally {

                convertBtn.disabled =
                    false;

            }

        }
    );


    /*
     * ==========================================================
     * Progress
     * ==========================================================
     */

    function setProgress(
        percent,
        text
    ) {

        progressValue.style.width =
            percent + "%";


        progressPercent.textContent =
            percent + "%";


        progressText.textContent =
            text;

    }


    /*
     * ==========================================================
     * Success
     * ==========================================================
     */

    function showSuccess(message) {

        status.textContent =
            "✓ " + message;

        status.className =
            "status success";

    }


    /*
     * ==========================================================
     * Error
     * ==========================================================
     */

    function showError(message) {

        status.textContent =
            "✕ " + message;

        status.className =
            "status error";

        status.style.display =
            "block";

    }


    /*
     * ==========================================================
     * Format size
     * ==========================================================
     */

    function formatFileSize(bytes) {

        if (bytes === 0) {

            return "0 Bytes";

        }


        const units = [
            "Bytes",
            "KB",
            "MB",
            "GB",
            "TB"
        ];


        const index =
            Math.floor(
                Math.log(bytes) /
                Math.log(1024)
            );


        return (
            (bytes /
                Math.pow(
                    1024,
                    index
                )
            ).toFixed(2)
            + " "
            + units[index]
        );

    }

</script>

</body>
</html>
