<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Thanh Toán Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dropdown */
        #bank-dropdown::-webkit-scrollbar {
            width: 8px;
        }
        #bank-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #bank-dropdown::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        #bank-dropdown::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Tạo QR Thanh Toán</h1>
            <p class="text-gray-500 mt-2">Nhanh chóng, tiện lợi và chính xác</p>
            <div class="flex justify-center space-x-4">
                &copy; <a href="https://vnscience.github.io" class="text-indigo-600 hover:underline">vnscience</a>
            </div>
        </div>

        <!-- Form Input -->
        <form id="qr-form" class="space-y-4">
            <!-- Searchable Dropdown for Banks -->
            <div class="relative" id="bank-combobox">
                <label for="bank-search-input" class="block text-sm font-medium text-gray-700 mb-1">Ngân Hàng</label>
                <input type="text" id="bank-search-input" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Tìm và chọn ngân hàng..." autocomplete="off">
                <input type="hidden" id="selected-bank-bin">
                <input type="hidden" id="selected-bank-code">
                <div id="bank-dropdown" class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto hidden">
                    <!-- Bank options will be populated by JS -->
                </div>
            </div>

            <div>
                <label for="account-number" class="block text-sm font-medium text-gray-700 mb-1">Số Tài Khoản</label>
                <input type="text" id="account-number" name="account-number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Nhập số tài khoản" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
                Tạo Mã QR
            </button>
        </form>

        <!-- Result Display -->
        <div id="result-container" class="mt-6 text-center hidden">
            <!-- QR Code Image -->
            <div id="qr-code" class="flex justify-center items-center p-4 bg-gray-50 rounded-lg border border-gray-200">
                 <img id="qr-image" src="" alt="Mã QR thanh toán" class="max-w-full h-auto rounded-md shadow-sm">
            </div>

            <!-- Download Button -->
            <div id="download-container" class="mt-4 hidden">
                 <a id="download-btn" href="#" download="qr-thanh-toan.png" class="inline-block w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform transform hover:scale-105">
                    Tải xuống QR (.png)
                </a>
            </div>
            
            <!-- Error Message -->
            <div id="error-message" class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg hidden">
                 <p id="error-text" class="text-red-700 font-medium"></p>
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bankCombobox = document.getElementById('bank-combobox');
            const bankSearchInput = document.getElementById('bank-search-input');
            const bankDropdown = document.getElementById('bank-dropdown');
            const selectedBankBin = document.getElementById('selected-bank-bin');
            const selectedBankCode = document.getElementById('selected-bank-code');

            const qrForm = document.getElementById('qr-form');
            const resultContainer = document.getElementById('result-container');
            const qrCodeDiv = document.getElementById('qr-code');
            const qrImage = document.getElementById('qr-image');
            const downloadContainer = document.getElementById('download-container');
            const downloadBtn = document.getElementById('download-btn');
            const errorMessageDiv = document.getElementById('error-message');
            const errorTextP = document.getElementById('error-text');
            const accountNumberInput = document.getElementById('account-number');

            let banks = [];

            // Fetch bank list from API
            async function fetchBanks() {
                try {
                    const response = await fetch('https://api.vietqr.io/v2/banks');
                    if (!response.ok) {
                        throw new Error('Không thể tải danh sách ngân hàng.');
                    }
                    const data = await response.json();
                    banks = data.data;
                    populateBankDropdown(banks);
                } catch (error) {
                    bankSearchInput.placeholder = `Lỗi: ${error.message}`;
                }
            }

            // Populate the bank dropdown list
            function populateBankDropdown(bankList) {
                bankDropdown.innerHTML = '';
                if (bankList.length === 0) {
                    bankDropdown.innerHTML = `<div class="p-2 text-gray-500">Không tìm thấy ngân hàng</div>`;
                    return;
                }
                bankList.forEach(bank => {
                    const option = document.createElement('div');
                    option.className = 'p-2 hover:bg-blue-100 cursor-pointer';
                    option.textContent = `${bank.shortName} - ${bank.name}`;
                    option.dataset.bin = bank.bin;
                    option.dataset.code = bank.code;
                    option.dataset.text = `${bank.shortName} (${bank.name})`;

                    option.addEventListener('click', () => {
                        bankSearchInput.value = option.dataset.text;
                        selectedBankBin.value = option.dataset.bin;
                        selectedBankCode.value = option.dataset.code;
                        bankDropdown.classList.add('hidden');
                    });
                    bankDropdown.appendChild(option);
                });
            }

            // Show dropdown on focus
            bankSearchInput.addEventListener('focus', () => {
                populateBankDropdown(banks); // Show all banks on focus
                bankDropdown.classList.remove('hidden');
            });

            // Filter banks on input
            bankSearchInput.addEventListener('input', () => {
                const searchTerm = bankSearchInput.value.toLowerCase().trim();
                const filteredBanks = banks.filter(bank => 
                    bank.name.toLowerCase().includes(searchTerm) || 
                    bank.shortName.toLowerCase().includes(searchTerm)
                );
                populateBankDropdown(filteredBanks);
                bankDropdown.classList.remove('hidden');
                
                // Clear selection if user is typing
                selectedBankBin.value = '';
                selectedBankCode.value = '';
            });

            // Hide dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!bankCombobox.contains(e.target)) {
                    bankDropdown.classList.add('hidden');
                }
            });

            // Handle form submission
            qrForm.addEventListener('submit', function(event) {
                event.preventDefault();

                // Reset UI
                errorMessageDiv.classList.add('hidden');
                qrCodeDiv.classList.add('hidden');
                downloadContainer.classList.add('hidden');

                const bankCode = selectedBankCode.value;
                const accountNumber = accountNumberInput.value.trim();

                if (!bankCode || !accountNumber) {
                    showError('Vui lòng chọn ngân hàng và nhập số tài khoản.');
                    return;
                }
                
                // Show result container
                resultContainer.classList.remove('hidden');

                // Generate and display QR code image
                const qrImageUrl = `https://img.vietqr.io/image/${bankCode}-${accountNumber}-compact.png`;
                qrImage.src = qrImageUrl;
                
                qrImage.onload = () => {
                    qrCodeDiv.classList.remove('hidden');
                    prepareDownload(qrImageUrl, `${bankCode}-${accountNumber}.png`);
                };
                qrImage.onerror = () => {
                    showError('Không thể tạo mã QR. Vui lòng kiểm tra lại thông tin.');
                };
            });

            // Prepare the download link
            async function prepareDownload(imageUrl, fileName) {
                try {
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);
                    
                    downloadBtn.href = objectUrl;
                    downloadBtn.download = fileName;
                    downloadContainer.classList.remove('hidden');

                } catch (error) {
                    console.error('Lỗi khi chuẩn bị file tải xuống:', error);
                }
            }
            
            function showError(message) {
                errorTextP.textContent = message;
                errorMessageDiv.classList.remove('hidden');
                qrCodeDiv.classList.add('hidden');
                downloadContainer.classList.add('hidden');
            }

            // Initial load
            fetchBanks();
        });
    </script>

</body>
</html>
