<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính thuế TNCN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen px-2 md:px-0">

<div class="max-w-5xl mx-auto mt-6 md:mt-10 bg-white shadow-xl rounded-2xl p-4 md:p-6">

    <h1 class="text-xl md:text-2xl font-bold text-center text-blue-600 mb-6">
        Công cụ tính thuế TNCN
    </h1>

    <!-- ===== TABLE INCOME ===== -->
    <div class="mb-6">
        <h2 class="font-semibold mb-2">Nguồn thu nhập</h2>

        <div class="overflow-x-auto">
            <table class="w-full border rounded-lg text-sm">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-2 text-left w-1/2">Nguồn thu</th>
                        <th class="p-2 text-right w-1/2">Số tiền</th>
                        <th class="p-2 w-16"></th>
                    </tr>
                </thead>
                <tbody id="incomeList"></tbody>
            </table>
        </div>

        <button onclick="addIncome()" 
            class="mt-3 w-full md:w-auto bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
            + Thêm dòng
        </button>
    </div>

    <!-- ===== DEDUCTIONS ===== -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

        <div>
            <label class="text-sm">Giảm trừ gia cảnh</label>
            <input type="text" id="giamtru" value="132.000.000"
                oninput="formatInput(this)"
                class="w-full border rounded-lg p-2 text-right font-mono">
        </div>

        <div>
            <label class="text-sm">Bảo hiểm</label>
            <input type="text" id="baohiem" value="0"
                oninput="formatInput(this)"
                class="w-full border rounded-lg p-2 text-right font-mono">
        </div>

        <div>
            <label class="text-sm">Thuế đã nộp</label>
            <input type="text" id="thuedanop" value="0"
                oninput="formatInput(this)"
                class="w-full border rounded-lg p-2 text-right font-mono">
        </div>

    </div>

    <!-- BUTTON -->
    <div class="text-center">
        <button onclick="tinhThue()"
            class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl text-lg">
            Tính thuế
        </button>
    </div>

    <!-- RESULT -->
    <div id="ketqua" class="mt-6 p-4 bg-gray-50 rounded-xl text-sm"></div>

</div>

<script>
// ===== FORMAT =====
function formatVND(n) {
    return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
    }).format(n);
}

function parseNumber(str) {
    return Number((str || "").replace(/\D/g, "")) || 0;
}

function formatInput(el) {
    let value = parseNumber(el.value);
    el.value = value ? value.toLocaleString('vi-VN') : "";
}

// ===== ADD ROW =====
function addIncome(name = "", value = 0) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td class="p-1">
            <input type="text"
                value="${name}"
                placeholder="Tên nguồn thu"
                class="w-full border rounded p-2">
        </td>

        <td class="p-1">
            <input type="text"
                value="${value}"
                oninput="formatInput(this)"
                placeholder="0"
                class="w-full border rounded p-2 text-right font-mono">
        </td>

        <td class="p-1 text-center">
            <button onclick="this.closest('tr').remove()"
                class="text-red-500 hover:text-red-700 text-lg">
                🗑️
            </button>
        </td>
    `;

    document.getElementById("incomeList").appendChild(tr);

    // focus
    setTimeout(() => {
        tr.querySelector("input").focus();
    }, 0);
}

// init
addIncome("Thu nhập chính", 0);

// ===== TAX =====
function tinhThueChiTiet(tn) {
    let bac = [
        { limit: 960000000, rate: 0.35 },
        { limit: 624000000, rate: 0.30 },
        { limit: 384000000, rate: 0.25 },
        { limit: 216000000, rate: 0.20 },
        { limit: 120000000, rate: 0.15 },
        { limit: 60000000,  rate: 0.10 },
        { limit: 0,         rate: 0.05 }
    ];

    let result = [];
    let thue = 0;

    for (let i = 0; i < bac.length; i++) {
        if (tn > bac[i].limit) {
            let taxable = tn - bac[i].limit;
            let tax = taxable * bac[i].rate;

            result.push({
                rate: bac[i].rate,
                taxable: taxable,
                tax: tax
            });

            thue += tax;
            tn = bac[i].limit;
        }
    }

    return { thue, result };
}

// ===== MAIN =====
function tinhThue() {
    let rows = document.querySelectorAll("#incomeList tr");
    let tongThu = 0;

    rows.forEach(row => {
        let val = parseNumber(row.children[1].querySelector("input").value);
        tongThu += val;
    });

    let giamTru = parseNumber(giamtru.value) + parseNumber(baohiem.value);
    let thuNhapTinhThue = Math.max(0, tongThu - giamTru);

    let { thue, result } = tinhThueChiTiet(thuNhapTinhThue);
    let conLai = thue - parseNumber(thuedanop.value);

    let rowsHTML = result.map(r => `
        <tr class="border-t">
            <td class="p-2">${r.rate * 100}%</td>
            <td class="p-2 text-right">${formatVND(r.taxable)}</td>
            <td class="p-2 text-right">${formatVND(Math.round(r.tax))}</td>
        </tr>
    `).join("");

    document.getElementById("ketqua").innerHTML = `
        <div class="space-y-2">

            <div><b>Tổng thu nhập:</b> ${formatVND(tongThu)}</div>
            <div><b>Thu nhập tính thuế:</b> ${formatVND(thuNhapTinhThue)}</div>

            <div class="text-blue-600 font-semibold">
                Thuế phải nộp: ${formatVND(Math.round(thue))}
            </div>

            <div class="${conLai > 0 ? 'text-red-500' : 'text-green-600'} font-semibold">
                ${conLai > 0 ? 'Còn phải nộp:' : 'Được hoàn:'}
                ${formatVND(Math.abs(Math.round(conLai)))}
            </div>

            <div class="mt-4">
                <div class="font-semibold mb-1">Chi tiết theo bậc thuế</div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm border rounded-lg">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-2 text-left">Thuế suất</th>
                                <th class="p-2 text-right">Thu nhập chịu thuế</th>
                                <th class="p-2 text-right">Thuế</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHTML}
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    `;
}
</script>

</body>
</html>
